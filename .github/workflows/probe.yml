name: Probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: |
          set -x
          npm i -g playwright >/dev/null && npx playwright install --with-deps chromium >/dev/null
          echo "npm root -g: $(npm root -g)"
          node -e "console.log(require.resolve('playwright'))"
          echo 'const {chromium}=require("playwright");(async()=>{const b=await chromium.launch();console.log("launch ok");await b.close();})();' > /tmp/t.js
          node /tmp/t.js
          NODE_PATH=$(npm root -g) node -e "console.log(require('playwright').chromium ? 'node_path ok':'no')"
