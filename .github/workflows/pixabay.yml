name: Pixabay search
on:
  push:
    branches: ['arena/1621eb24-my-films']
    paths: ['.github/workflows/pixabay.yml', 'studio-kit/stock-query.txt']
  workflow_dispatch:
    inputs:
      query:
        description: 'English stock search (for example: palm trees)'
        type: string
        required: false
permissions:
  contents: read
jobs:
  search:
    if: github.repository == 'alialdean12-hue/my-films'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/my-films-pixabay-public
          key: pixabay-public-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pixabay-public-v1-
      - name: Search Pixabay for photos and videos
        env:
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          STOCK_QUERY: ${{ inputs.query }}
        run: python3 studio-kit/scripts/pixabay_search.py
