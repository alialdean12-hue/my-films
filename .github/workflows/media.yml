name: Media fetch
on:
  push:
    branches-ignore: ['media-cache']
    paths: ['media_requests/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: media-cache
  cancel-in-progress: false
jobs:
  fetch:
    if: github.repository == 'alialdean12-hue/my-films'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: Open the media-cache branch
        run: |
          if git ls-remote --exit-code origin media-cache >/dev/null; then
            git fetch --depth 1 origin media-cache && git worktree add cache FETCH_HEAD
          else
            git worktree add --detach cache && (cd cache && git checkout --orphan tmp && git rm -rfq .)
          fi
      - name: Fetch photos (Wikimedia + Pixabay)
        env:
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          MEDIA_CACHE: /nonexistent
        run: |
          python3 - <<'PY'
          import glob, json, os, sys
          sys.path.insert(0, "studio-kit/scripts"); import images as IM
          for f in sorted(glob.glob("media_requests/*.json"))[-20:]:
              for it in json.load(open(f)).get("items", []):
                  d = os.path.join("cache", it["key"])
                  if os.path.exists(os.path.join(d, "credits.json")): continue
                  os.makedirs(d, exist_ok=True)
                  try:
                      res = IM.fetch_mixed(it["q"], d, photos=it.get("photos", "auto"))
                      for r in res: r["file"] = os.path.basename(r["file"]); r["thumb"] = os.path.basename(r.get("thumb") or r["file"])
                      json.dump(res, open(os.path.join(d, "credits.json"), "w"), ensure_ascii=False)
                      print("ok", len(res), it["q"])
                  except (Exception, SystemExit) as e:
                      open(os.path.join(d, "error.txt"), "w").write(str(e)); print("FAIL", it["q"], e)
          PY
      - name: Save to media-cache
        run: |
          cd cache
          git config user.name "media-bot"; git config user.email "media-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -qm "media for ${GITHUB_SHA::7}"
          git push origin HEAD:media-cache
