name: GSK film · voice and photos
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gsk.yml'
      - 'projects/gsk/script.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg
          python3 -m pip install --quiet edge-tts pillow numpy html2image 2>/dev/null || python3 -m pip install --quiet edge-tts pillow numpy
      - name: Voice
        run: |
          mkdir -p out/voice
          python3 - <<'PY'
          import json, subprocess, sys
          ep = json.load(open('projects/gsk/script.json'))
          json.dump([{'id': f'b{i}', 'text': b['line']} for i, b in enumerate(ep['beats'])], open('/tmp/lines.json','w'), ensure_ascii=False)
          v = ep.get('voice', {})
          subprocess.run([sys.executable, 'studio-kit/scripts/tts_edge.py', '/tmp/lines.json', 'out/voice',
                          '--voice', v.get('name','ar-SA-HamedNeural'), f"--rate={v.get('rate','-4%')}"], check=True)
          PY
      - name: Photos
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'studio-kit/scripts'); import images as IM
          ep = json.load(open('projects/gsk/script.json'))
          os.makedirs('out/media', exist_ok=True)
          cred = []
          for name, a in ep['assets'].items():
              q = a.get('query')
              if not q: continue
              try:
                  res = IM.fetch_mixed(q, 'out/media', photos=a.get('photos','auto'))
                  if res:
                      a['src'] = 'media/' + os.path.basename(res[0]['file'])
                      r = res[0]
                      cred.append(f"{name} (صورة): {str(r.get('title',''))[:60]} — {r.get('author','')} — {r.get('license','')} — {r.get('page','')}")
                      print('ok', name, a['src'])
                  else:
                      print('EMPTY', name)
              except BaseException as e:
                  print('FAIL', name, type(e).__name__, e)
          json.dump(ep, open('out/video.json','w'), ensure_ascii=False, indent=1)
          open('out/CREDITS.txt','w').write("\n".join(cred) + "\n")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f out
          git diff --cached --quiet && exit 0
          git commit -qm "gsk: voice + photos"
          git push
